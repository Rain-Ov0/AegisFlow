syntax = "proto3";

package aegisflow.v1;

// 决策
enum DecisionAction {
    // 未知决策，默认
    DECISION_ACTION_UNKOWN = 0;
    // 通过
    PASS = 1;
    // 人工审查
    REVIEW = 2;
    // 拒绝
    REJECT = 3;
}

message RiskReason {
    // 风险代码
    string code = 1;
    // 风险原因
    string message = 2;
    // 严重程度
    int32 severity = 3;
}

message FeatureSnapshot {
    string user_id = 1;

    uint32 user_login_1m = 2;
    uint32 user_login_5m = 3;
    uint32 user_login_1h = 4;
    uint32 user_login_fail_5m = 5;

    repeated string recent_actions = 6;
}

message Decision {
    uint64 event_id = 1;
    string user_id = 2;
    DecisionAction action = 3;
    int32 risk_score = 4;
    repeated RiskReason reasons = 5;
    uint64 cost_us = 6;

    FeatureSnapshot features = 7;
}

message ReportEventResponse {
    Decision decision = 1;
}

message BatchReportResponse {
    repeated Decision decisions = 1;
}