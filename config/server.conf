# 异步日志
log.level = INFO
log.file = logs/aegisflow.log
log.queue_capacity = 4096
log.flush_interval_ms = 200

# 服务
server.host = 0.0.0.0
server.port = 8080
server.io_threads = 2
server.max_connections = 65536
server.max_frame_payload_bytes = 1048576
server.idle_timeout_ms = 30000
server.io_timeout_ms = 10000
server.business_timeout_ms = 2000
server.shutdown_grace_timeout_ms = 5000

# 业务执行器
worker_pool.threads = 8
worker_pool.queue_capacity = 1024

# 特征冷状态回收
maintenance.interval_ms = 60000
maintenance.user_state_ttl_ms = 600000
maintenance.ip_state_ttl_ms = 1200000
maintenance.device_state_ttl_ms = 1200000

# 登录策略
policy.user_failure_review_threshold = 5
policy.ip_spray_review_threshold = 20
policy.device_sharing_review_threshold = 10
policy.ip_distinct_reject_threshold = 50
policy.ip_failure_reject_threshold = 500

# MySQL
mysql.host = 127.0.0.1
mysql.port = 3306
mysql.user = aegisflow
mysql.password = 123456
mysql.database = aegisflow

# 黑名单冷启与管理命令
blacklist.startup_timeout_ms = 10000
blacklist.batch_size = 100
blacklist.reset_timeout_ms = 10000
blacklist.maintenance_interval_ms = 1000
blacklist.maintenance_timeout_ms = 3000
blacklist.expire_cleanup_interval_ms = 60000
blacklist.candidate_queue_capacity = 4096
blacklist.candidate_batch_size = 256

# Redis 热缓存和待回写 Stream
redis.host = 127.0.0.1
redis.port = 6379
redis.username = 
redis.password = 
redis.database = 0
redis.connect_timeout_ms = 1000
redis.command_timeout_ms = 1000
redis.key_prefix = aegisflow:blacklist
